services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casepilot
      POSTGRES_USER: casepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casepilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casepilot -d casepilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
